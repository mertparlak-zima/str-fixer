name: ci

# Workspace rule (2026-11-04): validation triggers on pull_request + workflow_dispatch
# only - no duplicate post-merge push validation on main.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, docker, str-fixer]
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run synthetic subtitle and track-selection verification suite
        run: python3 scripts/selftest_suite.py
